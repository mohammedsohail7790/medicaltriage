name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: triage_test
          POSTGRES_PASSWORD: triage_test_password
          POSTGRES_DB: ist_triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage_test -d ist_triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://triage_test:triage_test_password@127.0.0.1:5432/ist_triage_test?schema=public
      AUDIT_DATABASE_URL: postgresql://triage_test:triage_test_password@127.0.0.1:5432/ist_triage_test?schema=public
      AUDIT_HMAC_SECRET: ci-only-audit-hmac-secret-not-for-production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend typecheck
        run: npx prisma generate && npx tsc -p tsconfig.json --noEmit

      - name: Frontend typecheck
        run: pnpm run typecheck:web

      - name: Validate isolated test database and apply migrations
        run: pnpm run test:db:guard && pnpm exec prisma migrate deploy

      # NFR-033 / NFR-136 / NFR-140: a database change must keep the previous release working.
      - name: Migration lint (backward-compatible changes only)
        run: pnpm run migrations:lint

      # NFR-082 / NFR-142: the backend tests run with coverage, and the quality gate fails the build when coverage is below
      # the thresholds in quality-thresholds.json.
      - name: Backend tests with coverage (including database-backed suites)
        run: pnpm run test:coverage

      - name: Quality gate (coverage thresholds)
        run: pnpm run quality:gate

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 90

      - name: Frontend tests
        run: pnpm run test:frontend

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on any newly-introduced HIGH or CRITICAL vulnerability
      # in a direct or transitive dependency - the concrete SOC2 gap this
      # closes ("no dependency vulnerability scanning" from the gap analysis).
      # Moderate/low findings are reported but don't block, since blocking on
      # every low-severity advisory would make this noisy enough to get
      # ignored or disabled outright.
      - name: pnpm audit (high/critical)
        run: pnpm audit --audit-level high

      # License compliance (NFR-056/163) - fails the build if any dependency
      # carries a license outside this allowlist of commercially-clean OSS
      # licenses. Excludes this project's own root package (which has no
      # published "license" field and would otherwise be flagged as
      # UNLICENSED against itself, a false positive, not a real dependency
      # license issue).
      - name: License compliance check
        run: npx license-checker-rseidelsohn --onlyAllow "MIT;ISC;Apache-2.0;BSD-3-Clause;BSD-2-Clause;BlueOak-1.0.0;MIT-0;MPL-2.0;CC0-1.0;CC-BY-4.0;CC-BY-3.0;OFL-1.1;0BSD;Unlicense;Zlib;(MIT AND Zlib)" --excludePackages "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"

      # SBOM (CycloneDX) generated at every push, published as a build
      # artifact - closes NFR-177. --ignore-npm-errors is required because
      # this repo uses pnpm (pnpm-lock.yaml), not npm; cyclonedx-npm's
      # underlying `npm ls` reports the peer/dev dependencies of *other
      # packages'* optional dev tooling as "missing" (they were never
      # installed by pnpm and aren't part of this project's own dependency
      # tree) - those warnings don't affect the accuracy of the generated SBOM
      # for packages actually shipped in this app.
      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build-only validation (no push, no registry credentials involved) -
      # catches a broken Dockerfile/build stage on every PR. Image builds
      # that actually deploy remain manual `gcloud builds submit` runs today
      # (see docs/container-image-signing.md) - this step only proves the
      # image still builds, it does not publish or sign anything.
      - name: Build image (validation only, not pushed)
        run: docker build -t ist-triage-ci-build-check:${{ github.sha }} .

  # AI-002: dynamic security testing on every change. The application is started from the change itself (demonstration
  # mode, no customer data), probed by the scripted checks, and scanned passively by ZAP. Authenticated dynamic testing
  # is part of the independent penetration test (M-006), not this job.
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start the application
        run: |
          pnpm exec prisma generate
          pnpm exec tsc -p tsconfig.json
          pnpm run build:web
          PORT=8080 node dist/index.js > app.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:8080/api/v1/runtime/environment >/dev/null && break; sleep 2; done
      - name: Scripted dynamic probe (fails on a high or critical finding)
        run: node scripts/dastProbe.mjs http://localhost:8080
      - name: ZAP baseline scan (passive)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports
          path: |
            report_html.html
            report_json.json
            app.log
          retention-days: 30
